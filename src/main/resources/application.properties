spring.application.name=turnos_bancolombia
server.port=8080

spring.config.import=optional:classpath:application-secrets.properties

spring.datasource.url=jdbc:mysql://localhost:3306/turnos_bancolombia?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Bogota

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

app.jwt.expiration-ms=3600000

app.cors.allowed-origins=http://localhost:3000,http://localhost:5173

app.turnos.umbral-envejecimiento-minutos=15
app.turnos.zona-horaria=America/Bogota
